# Static web app + load balancer for the API replicas (spec §3).
# The whole file is the main nginx config, so the stack is tuned in one place.

worker_processes auto;
# A benchmark holds thousands of client and upstream connections open at once.
worker_rlimit_nofile 65535;

events {
  worker_connections 16384;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server_tokens off;
  sendfile      on;
  # Request logging would cost CPU during a benchmark and the API logs every request itself.
  access_log    off;
  error_log     /var/log/nginx/error.log warn;

  gzip            on;
  gzip_types      text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  # `api` is the Compose service name; Docker's DNS returns one address per replica and nginx
  # load-balances across them (round robin). Addresses are resolved when nginx starts, so after
  # recreating the API containers run `docker compose restart web`. Keepalive reuses upstream
  # connections instead of opening one per request.
  upstream api {
    server api:4200;
    keepalive 512;
    keepalive_requests 100000;
    keepalive_timeout 60s;
  }

  server {
    listen 80 default_server;
    root   /usr/share/nginx/html;
    index  index.html;

    client_max_body_size 256k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Server-sent events: never buffer or time out a healthy stream (the API sends a heartbeat every 15 s).
    # A regex location beats the plain /api/ prefix below.
    location ~ ^/api/events/.+/stream$ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # POSTs are never retried on another replica (nginx's default), so a timeout cannot double-submit a hold or payment.
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # Hashed build assets never change; index.html must always be revalidated.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      try_files $uri =404;
    }

    # Single-page app: any other path is a client-side route. The pages (checkout and admin among
    # them) load only this origin's own scripts, styles, fonts and API (no CDN, by design), and may
    # not be framed by another site (clickjacking): frame-ancestors, plus X-Frame-Options for old browsers.
    location / {
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
      add_header X-Frame-Options DENY always;
      try_files $uri $uri/ /index.html;
    }
  }
}
